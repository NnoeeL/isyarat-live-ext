<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <rect x="8" y="8" width="28" height="28" rx="8" fill="#10b981"/>
  <text x="22" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#022c22">M</text>
  <!-- Stylized hand posture -->
  <g transform="translate(22, 16)">
    <!-- Thumb -->
    <rect x="12" y="56" width="11" height="16" rx="5.5" transform="rotate(-15 10 60)" fill="#475569"/>
    <!-- Index -->
    <rect x="20" y="32" width="11" height="22" rx="5.5" fill="#38bdf8"/>
    <!-- Middle -->
    <rect x="34" y="30" width="11" height="22" rx="5.5" fill="#38bdf8"/>
    <!-- Ring -->
    <rect x="48" y="32" width="11" height="22" rx="5.5" fill="#38bdf8"/>
    <!-- Pinky -->
    <rect x="62" y="48" width="10" height="10" rx="5" fill="#475569"/>
    <!-- Palm -->
    <rect x="18" y="50" width="54" height="34" rx="14" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="60" y="111" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8.5" fill="#94a3b8">3 jari menutupi ibu jari</text>
</svg>
